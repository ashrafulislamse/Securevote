name = "securevote-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Deploy as a Worker + static assets? No — API only. (_routes.json not needed here.)

[vars]
API_VERSION = "1.0.0"
ENV = "development"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "securevote"
database_id = "8c3a411c-2787-4a57-98fb-6f33aed5944f"

# R2 file storage (KYC docs, candidate images)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "securevote-files"

# KV for sessions / rate limiting / cache
[[kv_namespaces]]
binding = "SESSIONS"
id = "79069c0b141f4860bbaf5343e12027d2"

# Workers AI binding (admin AI assistant)
[ai]
binding = "AI"

# Cron: chain listener (Phase 6) — every 60s
[triggers]
crons = ["* * * * *"]