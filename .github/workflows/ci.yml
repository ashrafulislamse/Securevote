name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # API — TypeScript check + unit/integration tests (vitest)
  # ---------------------------------------------------------------------------
  api:
    name: API · typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npx vitest run

  # ---------------------------------------------------------------------------
  # Web portal — TypeScript check + Next.js production build
  # ---------------------------------------------------------------------------
  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securevote_web_portal
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: securevote_web_portal/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Next.js)
        run: pnpm build
        env:
          # Static-prerendered pages don't need a live API at build time.
          NEXT_PUBLIC_API_BASE_URL: https://api.securevote.workers.dev

  # ---------------------------------------------------------------------------
  # Smart contracts — Hardhat compile + test suite
  # ---------------------------------------------------------------------------
  contracts:
    name: Contracts · compile + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: contracts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: npx hardhat compile

      - name: Test
        run: npx hardhat test

  # ---------------------------------------------------------------------------
  # Flutter — static analysis (no emulator needed)
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter · analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securevote_flutter_sim
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
